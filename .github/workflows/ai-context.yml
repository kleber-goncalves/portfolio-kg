name: AI Context — Synchronize

on:
  push:
    branches:
      - "**"
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - dev
      - feat/responsividadeFull

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ai-context-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-after-push:
    name: Refresh context after a branch push
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update generated context snapshot
        env:
          AI_CONTEXT_COMMIT_SHA: ${{ github.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/update-ai-context.mjs

      - name: Commit and push generated changes
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- docs/AI_CONTEXT.md; then
            echo "The AI context snapshot is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AI_CONTEXT.md
          git commit -m "docs(ai-context): atualizar snapshot automaticamente"
          git push origin "HEAD:${BRANCH_NAME}"

  sync-pull-request:
    name: Refresh context on same-repository pull requests
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Load the trusted context generator from the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "${BASE_SHA}" --depth=1
          git show "${BASE_SHA}:scripts/update-ai-context.mjs" > "${RUNNER_TEMP}/update-ai-context-trusted.mjs"
          cp "${RUNNER_TEMP}/update-ai-context-trusted.mjs" scripts/update-ai-context.mjs

      - name: Update generated context snapshot
        env:
          AI_CONTEXT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF_NAME: ${{ github.event.pull_request.head.ref }}
        run: node scripts/update-ai-context.mjs

      - name: Restore the branch's context generator
        run: git checkout -- scripts/update-ai-context.mjs

      - name: Commit and push generated changes to the pull request branch
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- docs/AI_CONTEXT.md; then
            echo "The pull request's AI context snapshot is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AI_CONTEXT.md
          git commit -m "docs(ai-context): atualizar snapshot do pull request"
          git push origin "HEAD:${PR_HEAD_REF}"
