name: Menu Desktop Reduced Visibility

on:
  push:
    branches:
      - main
      - dev
      - feat/responsividadeFull
    paths:
      - ".github/workflows/menu-desktop-reduced.yml"
      - "scripts/test-menu-desktop-reduced.mjs"
      - "src/components/HeroSectionTransition.jsx"
      - "src/components/MenuDesktop.jsx"
      - "src/components/SmoothScroll.jsx"
      - "src/utils/experienceMode.js"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menu-desktop-reduced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-menu-visibility:
    name: Verify Reduced desktop hamburger after switch and refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install temporary Playwright tools
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start local production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ --output /dev/null; then
              echo "Local production preview is responding."
              exit 0
            fi

            echo "Attempt $attempt/30: waiting for the preview."
            sleep 2
          done

          cat /tmp/vite-preview.log
          exit 1

      - name: Test desktop hamburger in Reduced mode
        run: node scripts/test-menu-desktop-reduced.mjs
