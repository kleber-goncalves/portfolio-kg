name: Lighthouse Performance Route Matrix

on:
  push:
    branches:
      - main
      - dev
      - feat/responsividadeFull
      - feat/separacao-paginas
      - feat/auditoria-multirota
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vite.analysis.config.js"
      - "src/data/seoRoutes.json"
      - "scripts/generate-seo-routes.mjs"
      - "lighthouserc-performance-*.json"
      - ".github/workflows/lighthouse-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse on all routes — mobile and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Start local production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/lighthouse-preview.log 2>&1 &
          echo $! > /tmp/lighthouse-preview.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ --output /dev/null; then
              echo "Production preview is responding."
              exit 0
            fi
            echo "Attempt $attempt/30: waiting for preview."
            sleep 2
          done

          cat /tmp/lighthouse-preview.log
          exit 1

      - name: Lighthouse — mobile, all routes (3 runs each)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc-performance-mobile.json
          artifactName: lighthouse-performance-mobile
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Lighthouse — desktop, all routes (3 runs each)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc-performance-desktop.json
          artifactName: lighthouse-performance-desktop
          uploadArtifacts: true
          temporaryPublicStorage: false
