name: Optimize project images

on:
  push:
    branches:
      - main
      - dev
      - feat/responsividadeFull
      - feat/separacao-paginas
    paths:
      - "src/assets/projetos/**"
      - "public/euNv.png"
      - "public/euNvEnvt.png"
      - "src/pages/sobre/SobreHero.jsx"
      - "src/components/HeroDesktop.jsx"
      - "src/components/HeroMobile.jsx"
      - "scripts/optimize-project-images.mjs"
      - ".github/workflows/optimize-project-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    name: Generate responsive WebP variants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Sharp for this workflow
        run: npm install --no-save --package-lock=false sharp

      - name: Generate responsive image variants and metadata
        run: node scripts/optimize-project-images.mjs

      - name: Commit generated images when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d public/_optimized ]; then
            git add -A -- public/_optimized
          fi

          if [ -f src/generated/imageMetadata.json ]; then
            git add -A -- src/generated/imageMetadata.json
          fi

          if git diff --cached --quiet; then
            echo "As imagens otimizadas já estão atualizadas; nenhum commit necessário."
            exit 0
          fi

          git commit -m "chore(images): generate responsive WebP variants [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
