name: Mobile UI Sound Slider

on:
  push:
    branches:
      - dev
    paths:
      - "src/components/MenuMobile.jsx"
      - "src/components/SoundToggle.jsx"
      - "src/components/SoundVolumeSliderMobile.jsx"
      - "src/utils/uiSfx.js"
      - "scripts/test-mobile-ui-sfx-slider.mjs"
      - ".github/workflows/mobile-ui-sfx-slider.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ui-sfx-slider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile-ui-sfx-slider:
    name: Verify touch slider, audio unlock, and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install temporary Playwright runner
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate production build
        run: npm run build

      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/mobile-ui-sfx-preview.log 2>&1 &
          echo $! > /tmp/mobile-ui-sfx-preview.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ --output /dev/null; then
              echo "Local production preview is responding."
              exit 0
            fi

            echo "Attempt $attempt/30: waiting for the preview."
            sleep 2
          done

          cat /tmp/mobile-ui-sfx-preview.log
          exit 1

      - name: Test mobile touch behavior and sound preferences
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node scripts/test-mobile-ui-sfx-slider.mjs
