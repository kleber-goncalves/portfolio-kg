name: Route UI UX Audit

on:
  push:
    branches:
      - main
      - dev
      - feat/responsividadeFull
      - feat/separacao-paginas
      - feat/auditoria-multirota
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "src/data/seoRoutes.json"
      - "scripts/audit-route-uiux.mjs"
      - ".github/workflows/route-uiux-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: route-uiux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Direct routes, SPA navigation and responsive geometry
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install temporary Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production assets
        run: npm run build

      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/route-uiux-preview.log 2>&1 &
          echo $! > /tmp/route-uiux-preview.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ --output /dev/null; then
              echo "Production preview is ready."
              exit 0
            fi
            echo "Attempt $attempt/30: waiting for preview."
            sleep 2
          done

          cat /tmp/route-uiux-preview.log
          exit 1

      - name: Audit routes, responsive layout and SPA navigation
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node scripts/audit-route-uiux.mjs

      - name: Upload UI/UX reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-uiux-audit
          path: artifacts/route-uiux/
          if-no-files-found: warn
          retention-days: 14
